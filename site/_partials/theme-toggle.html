<!-- No-JS theme toggle: the ◐ label flips this checkbox; CSS flips the palette.
     The external script is optional sugar - it only persists the choice. Loading it
     directly after the checkbox applies a saved theme before visible page content. -->
<input type="checkbox" id="themeswitch" class="visually-hidden" role="switch"
       aria-label="Switch between dark and light theme">
<script src="js/theme.js?v={{ASSET_V}}"></script>
