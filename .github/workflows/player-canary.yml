# Player canary: is the DEPLOYED web player still working, right now?
#
# The page is static and cannot rot by itself - what breaks overnight are the external
# contracts it stands on (the station's CORS grant, the JSON shape, the HTTPS /live
# streams, the cover URLs), none of which this project controls. So this runs daily
# against the live site, plus right after every deploy, plus on demand.
#
# Alerting: GitHub's failure mail is a fixed template with no room for a reason, so on
# failure the canary opens (or comments on) a 'canary'-labelled issue carrying the test
# output - and THAT notification email does contain it. The next green run closes the
# issue, which doubles as the "recovered" mail GitHub never sends on its own.
#
# NOTE: GitHub disables cron workflows on public repos after ~60 days without commits;
# the Actions tab shows a re-enable banner if that ever happens.
name: Player canary

on:
  schedule:
    - cron: "17 5 * * *"   # daily, off the top-of-hour congestion
  workflow_dispatch:
    inputs:
      url:
        description: "Override the tested site URL (empty = the live site)"
        required: false
  workflow_run:
    workflows: ["Deploy site", "Release"]   # both end in a Pages deployment
    types: [completed]

permissions:
  contents: read
  actions: write   # keep-alive: the last step re-enables this workflow's own schedule
  issues: write    # failure reports: open/comment/close the canary issue

concurrency:
  group: player-canary
  cancel-in-progress: true

jobs:
  canary:
    # For workflow_run triggers, only test what actually deployed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # What does the station serve THIS runner's (datacenter) IP? Expect 403s here:
      # the WAF rejects non-browser clients (curl/node) from datacenter IPs while
      # letting genuine browser traffic through - which is why every actual test runs
      # inside Chrome. This output exists for failure archaeology: if the BROWSER tests
      # fail while these curls suddenly return 200, the WAF changed its rules again.
      - name: Probe the station from the runner (403s here are NORMAL)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          for url in \
            "https://streamingsoundtracks.com/soap/FM24sevenJSON.php?action=GetCurrentlyPlaying&_t=1" \
            "https://streamingsoundtracks.com/live" \
            "https://death.fm/live"; do
            printf "curl-default : %s -> %s\n" "$url" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -r 0-64 "$url" || echo ERR)"
            printf "browser-UA   : %s -> %s\n" "$url" "$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" -H 'Origin: https://24sevenfm-covers.dudesoft.app' --max-time 15 -r 0-64 "$url" || echo ERR)"
          done

      - name: Install Playwright + Chrome
        run: |
          npm ci
          # Branded Chrome, not Chromium: the AAC decoder for the audio/aacp stream
          # test is a proprietary codec Chromium doesn't ship.
          npx playwright install --with-deps chrome

      # tee'd so the failure report can quote the output; pipefail, because the default
      # bash -e does NOT propagate the left side's exit code through a pipe (the step
      # would go green on tee's 0 while every test failed).
      - name: Run the canary against the live site
        env:
          PLAYER_URL: ${{ inputs.url }}   # empty on schedule/workflow_run -> live site
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee result.log

      # GitHub's failure email is a fixed template - the REASON can't ride along. An
      # issue's notification email carries its body, so the failure report goes there:
      # first failure opens the issue, repeats comment on it (one thread, one mail per
      # run), and the next green run closes it - which is also the recovery signal.
      - name: Report the failure as an issue (its email carries the reason)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYER_URL: ${{ inputs.url }}   # also here, or the report names the wrong target
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create canary --description "Automated player-canary failure reports" --color d93f0b 2>/dev/null || true
          {
            echo "The player canary failed against \`${PLAYER_URL:-the live site}\`. Test output (tail):"
            echo '```'
            tail -c 6000 result.log 2>/dev/null || echo "(no test output - the run failed before the tests started)"
            echo '```'
            echo "Full log: $RUN_URL"
          } > report.md
          OPEN=$(gh issue list --label canary --app github-actions --state open \
            --json number,title --jq 'map(select(.title | endswith("Player canary failing")))[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file report.md
          else
            # Assign the owner: the issue's author is github-actions[bot], and GitHub
            # only emails watchers or PARTICIPANTS - an unassigned bot issue can sail
            # by without notifying anyone. Assignment makes the owner a participant,
            # so open/comment/close all notify regardless of watch settings.
            gh issue create --title "🔴 Player canary failing" --label canary \
              --assignee "$GITHUB_REPOSITORY_OWNER" --body-file report.md
          fi

      - name: Close the failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          OPEN=$(gh issue list --label canary --app github-actions --state open \
            --json number,title --jq 'map(select(.title | endswith("Player canary failing")))[0].number')
          if [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "The canary is green again: $RUN_URL"
          fi

      # GitHub disables cron workflows on public repos after ~60 days without repo
      # activity. Re-enabling our own workflow is the documented-by-practice way to
      # re-arm that timer (idempotent when already enabled), and running it daily
      # means the deadline never approaches. always(): a failing canary must keep
      # its schedule alive too - a red canary is information, a dead one is silence.
      # Residual risk: once actually disabled, nothing here runs to self-revive; for
      # that case GitHub emails the workflow author, and any commit also resets it.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable player-canary.yml -R ${{ github.repository }}
