# Hosted runners validate release builds. SimplySign authentication happens locally;
# installer/publish_release.ps1 is the only publisher of new native releases.
name: Native release build

on:
  push:
    branches: [master]
    paths:
      - 'winamp/gen_version.h'
      - 'foobar2000/foo_24sevenfm_covers/foo_version.h'
      - 'desktop/viewer_version.h'
      - 'installer/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            throw 'makensis.exe missing after install'
          }
      - name: Verify signing failure gates
        shell: pwsh
        run: ./installer/code_signing.test.ps1
      - name: Test, build and package development artifacts
        shell: pwsh
        run: |
          ./installer/build_artifacts.ps1 -Build -Unsigned -Toolset v143
          $files = @(Get-ChildItem www/downloads -File)
          if ($files.Count -ne 14) { throw "expected 14 build files, found $($files.Count)" }
          'Native build passed. Publish signed releases locally with installer/publish_release.ps1 -Publish.' >> $env:GITHUB_STEP_SUMMARY
